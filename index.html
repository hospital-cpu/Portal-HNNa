<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor Office</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
  <script defer src="renderer.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Editor Office</h1>
    <div class="actions">
      <button id="newTabBtn">+ Nova aba</button>
      <button id="openFileBtn">Abrir .docx/.html/.txt</button>
      <button id="savePdfBtn">Salvar PDF</button>
    </div>
  </header>

  <nav id="tabs" class="tabs"></nav>

  <section class="toolbar">
    <button data-cmd="bold"><b>Negrito</b></button>
    <button data-cmd="italic"><i>Itálico</i></button>
    <button data-cmd="underline"><u>Sublinhado</u></button>
    <button data-cmd="insertUnorderedList">Lista •</button>
    <button data-cmd="insertOrderedList">Lista 1.</button>
    <button id="insertTableBtn">Inserir tabela</button>
    <button data-cmd="justifyLeft">Esq</button>
    <button data-cmd="justifyCenter">Centro</button>
    <button data-cmd="justifyRight">Dir</button>
  </section>

  <main>
    <div id="editor" class="editor" contenteditable="true"></div>
  </main>

  <input id="fileInput" type="file" accept=".docx,.html,.txt" hidden />
</body>
</html>
